# ======================================================
# Trimitha - Nginx Configuration
# Purpose: Single 301 redirect to canonical URL
# Final Destination: https://www.trimitha.co.in/
# ======================================================

server {
    listen 80;
    listen [::]:80;
    server_name trimitha.co.in www.trimitha.co.in;
    
    # ==================================================
    # HTTP → HTTPS REDIRECT (Single 301)
    # ==================================================
    
    location / {
        return 301 https://www.trimitha.co.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trimitha.co.in;
    
    # SSL Configuration (adjust as needed)
    ssl_certificate /path/to/ssl/certificate.crt;
    ssl_certificate_key /path/to/ssl/private.key;
    
    # ==================================================
    # NON-WWW → WWW REDIRECT (Single 301)
    # ==================================================
    
    location / {
        return 301 https://www.trimitha.co.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.trimitha.co.in;
    
    # SSL Configuration
    ssl_certificate /path/to/ssl/certificate.crt;
    ssl_certificate_key /path/to/ssl/private.key;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # ==================================================
    # ROOT DIRECTORY
    # ==================================================
    
    root /var/www/trimitha;
    index index.html;
    
    # ==================================================
    # CLEAN URLS (Remove .html extension)
    # ==================================================
    
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    
    # ==================================================
    # REMOVE INDEX.HTML FROM URLS
    # ==================================================
    
    location = /index.html {
        return 301 /;
    }
    
    # ==================================================
    # REDIRECT .html TO EXTENSIONLESS
    # ==================================================
    
    location ~ ^(.+?)\.html$ {
        if ($request_uri !~ ^/(.*)\.html$) {
            return 301 $scheme://www.trimitha.co.in$1;
        }
    }
    
    # ==================================================
    # REMOVE TRAILING SLASH FOR NON-DIRECTORIES
    # ==================================================
    
    location ~ /$ {
        if ($request_uri ~ ^/(.*)/$) {
            set $clean_uri $1;
            if (!-d $document_root$request_uri) {
                return 301 $scheme://www.trimitha.co.in/$clean_uri;
            }
        }
    }
    
    # ==================================================
    # STATIC FILE CACHING
    # ==================================================
    
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # ==================================================
    # GZIP COMPRESSION
    # ==================================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml;
}
